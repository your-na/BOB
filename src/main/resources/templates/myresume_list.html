<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>나만의 이력서</title>
  <link rel="stylesheet" href="/css/myresume_list.css">
  <link rel="stylesheet" th:href="@{/css/header.css}">
</head>
<body>

<!-- header -->
<div th:insert="~{header :: header}"></div>

<div class="resume-wrapper">
  <div class="resume-header">
    <h2>내 이력서 목록</h2>
    <a class="add-resume-btn" href="/myresume">+ 이력서 추가하기</a>
  </div>

  <div class="resume-list">
    <div class="resume-card">
      <div class="resume-text">
        <div class="resume-title">프론트엔드 포지션용 이력서</div>
        <div class="resume-info">작성일: 2025-07-20</div>
      </div>
      <div class="resume-buttons">
        <button class="view-btn">보기</button>
        <button class="edit-btn">수정</button>
        <button class="delete-btn">삭제</button>
      </div>
    </div>

    <div class="resume-card">
      <div class="resume-text">
        <div class="resume-title">백엔드 공채 지원용</div>
        <div class="resume-info">작성일: 2025-07-10</div>
      </div>
      <div class="resume-buttons">
        <button class="view-btn">보기</button>
        <button class="edit-btn">수정</button>
        <button class="delete-btn">삭제</button>
      </div>
    </div>

    <!-- 이력서 항목 추가 가능 -->
  </div>
</div>

</body>
</html>
