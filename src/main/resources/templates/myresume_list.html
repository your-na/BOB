<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>나만의 이력서</title>
  <meta name="_csrf" th:content="${_csrf.token}" />
  <meta name="_csrf_header" th:content="${_csrf.headerName}" />
  <link rel="stylesheet" th:href="@{/css/myresume_list.css}">
  <link rel="stylesheet" th:href="@{/css/header.css}">
</head>
<body>

<!-- header -->
<div th:insert="~{header :: header}"></div>

<div class="resume-wrapper">
  <div class="resume-header">
    <h2>내 이력서 목록</h2>
    <a class="add-resume-btn" href="/myresume">+ 이력서 추가하기</a>
  </div>

  <div class="resume-list">
    <!-- ✅ 이력서가 있을 때 -->
    <div class="resume-card" th:each="resume : ${resumes}">
      <div class="resume-text">
        <div class="resume-title" th:text="${resume.title}">이력서 제목</div>
        <div class="resume-info"
             th:if="${resume.createdAt != null}"
             th:text="'작성일: ' + ${#temporals.format(resume.createdAt, 'yyyy-MM-dd')}">
          작성일
        </div>
      </div>
      <div class="resume-buttons">
        <button class="view-btn" th:attr="data-id=${resume.id}">보기</button>
        <button class="edit-btn" th:attr="data-id=${resume.id}">수정</button>
        <button class="delete-btn" th:attr="data-id=${resume.id}">삭제</button>
      </div>
    </div>

    <!-- ✅ 이력서가 하나도 없을 때 -->
    <div th:if="${#lists.isEmpty(resumes)}" class="empty-resume">
      <p>생성된 이력서가 없습니다.</p>
      <p>우측 상단의 '+ 이력서 추가하기' 버튼을 통해 나의 이력서를 제작할 수 있습니다.</p>
    </div>
  </div>


  <!-- ✅ JS: 보기 버튼 누르면 상세보기로 이동 -->
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const viewButtons = document.querySelectorAll(".view-btn");

    viewButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        const resumeId = btn.getAttribute("data-id");
        if (resumeId) {
          // 상세보기 페이지로 이동
          window.location.href = `/myresume/${resumeId}`;
        }
      });
    });

    // ✅ CSRF 토큰 읽기
    const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');
    
    // 삭제 버튼
    const deleteButtons = document.querySelectorAll(".delete-btn");
    deleteButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        const resumeId = btn.getAttribute("data-id");
        if (!resumeId) return;

        const confirmed = confirm("정말 이 이력서를 삭제하시겠습니까?");
        if (!confirmed) return;

        fetch(`/api/myresumes/${resumeId}`, {
          method: 'DELETE',
          headers: {
            [csrfHeader]: csrfToken  // ✅ 헤더에 CSRF 토큰 추가!
          }
        })
                .then(res => {
                  if (res.status === 204) {
                    alert("삭제되었습니다.");
                    const card = btn.closest(".resume-card");
                    if (card) card.remove();
                  } else {
                    alert("삭제 실패! 다시 시도해 주세요.");
                  }
                })
                .catch(err => {
                  console.error("삭제 요청 실패:", err);
                  alert("오류가 발생했습니다.");
                });
      });
    });
  });

  const editButtons = document.querySelectorAll(".edit-btn");
  editButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      const resumeId = btn.getAttribute("data-id");
      if (resumeId) {
        window.location.href = `/myresume/edit/${resumeId}`;
      }
    });
  });

</script>

</body>
</html>
