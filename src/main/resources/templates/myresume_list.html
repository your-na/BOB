<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>나만의 이력서</title>
  <link rel="stylesheet" th:href="@{/css/myresume_list.css}">
  <link rel="stylesheet" th:href="@{/css/header.css}">
</head>
<body>

<!-- header -->
<div th:insert="~{header :: header}"></div>

<div class="resume-wrapper">
  <div class="resume-header">
    <h2>내 이력서 목록</h2>
    <a class="add-resume-btn" href="/myresume">+ 이력서 추가하기</a>
  </div>

  <div class="resume-list">
    <div class="resume-card" th:each="resume : ${resumes}">
      <div class="resume-text">
        <div class="resume-title" th:text="${resume.title}">이력서 제목</div>
        <div class="resume-info"
             th:if="${resume.createdAt != null}"
             th:text="'작성일: ' + ${#temporals.format(resume.createdAt, 'yyyy-MM-dd')}">
          작성일
        </div>
      </div>
      <div class="resume-buttons">
        <button class="view-btn" th:attr="data-id=${resume.id}">보기</button>
        <button class="edit-btn" th:attr="data-id=${resume.id}">수정</button>
        <button class="delete-btn" th:attr="data-id=${resume.id}">삭제</button>
      </div>
    </div>
  </div>
</div>

</body>
</html>
