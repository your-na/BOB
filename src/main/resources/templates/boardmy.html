<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>내가 쓴 게시글</title>
    <link rel="stylesheet" href="/css/boardmy.css">
    <link rel="stylesheet" th:href="@{/css/header.css}">
</head>
<body>

<!-- header -->
<div th:insert="~{header :: header}"></div>

<div class="page-wrapper">
    <div class="container">

        <div class="header-line">
            <h2 class="page-title">내가 쓴 게시글</h2>

            <div class="search-box">
                <input type="text" placeholder="검색어를 입력해주세요">
                <button class="search-btn">
                    <img src="/images/search.png" alt="검색">
                </button>
            </div>
        </div>

        <!-- 게시글 목록 -->
        <table class="board-table">
            <thead>
            <tr>
                <th>게시판</th>
                <th>제목</th>
                <th>작성자</th>
                <th>작성일</th>
                <th><input type="checkbox" id="checkAll"></th>
            </tr>
            </thead>
            <tbody id="myPostList"></tbody>
        </table>

        <!-- 아래 선택 옵션 -->
        <div class="bottom-area">
            <label>
                <input type="checkbox" id="checkAllBottom">
                전체선택
            </label>

            <button class="delete-btn">삭제</button>
        </div>

    </div>
</div>

<script>
    const tbody = document.getElementById("myPostList");

    // 📌 내가 쓴 게시글 불러오기
    async function loadMyPosts() {
        try {
            const response = await fetch("/api/posts/my");

            if (!response.ok) {
                alert("로그인이 필요합니다!");
                return;
            }

            const posts = await response.json();
            renderMyPosts(posts);

        } catch (error) {
            console.error("내 게시글 불러오기 실패:", error);
        }
    }

    // 📌 HTML 렌더링
    function renderMyPosts(posts) {
        tbody.innerHTML = "";

        posts.forEach(post => {
            const tr = document.createElement("tr");

            // 🔥 게시글 ID를 data-id로 담기 (삭제용)
            tr.setAttribute("data-id", post.id);

            tr.innerHTML = `
                <td>${post.category}</td>
                <td>${post.title}</td>
                <td>${post.writer}</td>
                <td>${post.createdAt}</td>
                <td><input type="checkbox" class="row-check"></td>
            `;

            // ✔ 상세보기 이동
            tr.addEventListener("click", (e) => {
                if (e.target.type === "checkbox") return;
                location.href = "/boarddetail?id=" + post.id;
            });

            tbody.appendChild(tr);
        });
    }

    // 📌 페이지 로드시 실행
    loadMyPosts();


    // ===========================
    // ✔ 체크박스 전체 선택
    // ===========================
    const checkAll = document.getElementById("checkAll");
    const checkAllBottom = document.getElementById("checkAllBottom");

    function syncCheckAll(checked) {
        document.querySelectorAll(".row-check").forEach(ch => ch.checked = checked);
        checkAll.checked = checked;
        checkAllBottom.checked = checked;
    }

    checkAll.addEventListener("change", e => syncCheckAll(e.target.checked));
    checkAllBottom.addEventListener("change", e => syncCheckAll(e.target.checked));

    // ▶ 삭제는
    document.querySelector(".delete-btn").addEventListener("click", async () => {
        const selected = document.querySelectorAll(".row-check:checked");
        if (selected.length === 0) {
            alert("삭제할 게시글을 선택해주세요!");
            return;
        }

        if (!confirm("정말 삭제하시겠습니까?")) return;

        const selectedIds = Array.from(selected).map(chk =>
            chk.closest("tr").getAttribute("data-id")
        );

        try {
            const response = await fetch("/api/posts/delete", {
                method: "DELETE",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(selectedIds)
            });

            if (!response.ok) {
                const errorMsg = await response.text();
                alert("삭제 실패: " + errorMsg);
                return;
            }

            alert("삭제 성공!");
            loadMyPosts(); // 목록 갱신

        } catch (err) {
            console.error("삭제 요청 중 오류:", err);
            alert("삭제 중 오류가 발생했습니다.");
        }
    });




</script>


</body>
</html>
