<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>신고 내역</title>
  <link rel="stylesheet" href="/css/ad_reports.css">
</head>
<body>

<section class="inquiry-list">
  <h2>신고 내역</h2>

  <!-- 검색 및 필터 -->
  <div class="top-bar">
    <div class="filter-dropdown">
      <button class="filter-btn">최신순 ▼</button>
      <ul class="filter-menu">
        <li data-filter="latest">최신순</li>
        <li data-filter="oldest">오래된순</li>
      </ul>
    </div>
    <input type="text" id="search-input" placeholder="검색어 입력">
  </div>

  <!-- 문의 내역 테이블 -->
  <table class="inquiry-table">
    <thead>
    <tr>
      <th>신고 제목</th>
      <th>신고 유형</th>
      <th>회원 닉네임</th>
      <th>신고 대상</th>
      <th>신고날짜</th>
      <th>처리상태</th>
    </tr>
    </thead>
    <tbody id="inquiry-body">
    <!-- ✅ 데이터가 있을 경우 -->
    <tr th:each="inq : ${inquiries}">
      <td th:text="${inq.title}" style="color:black; font-weight:bold;"></td>
      <td th:text="${inq.type}"></td>
      <td th:text="${inq.nickname}"></td>
      <td th:text="${inq.email}"></td>
      <td>
        <a th:href="@{'/admin/inquiries/' + ${inq.id}}">
          <button class="detail-btn">상세보기</button>
        </a>
      </td>
    </tr>

    <!-- ✅ 데이터가 없을 경우 -->
    <tr th:if="${#lists.isEmpty(inquiries)}">
      <!-- ✅ 데이터가 없을 경우 -->
    <tr th:if="${#lists.isEmpty(inquiries)}">
      <td colspan="6" style="text-align:center; color: gray;">등록된 신고 내역이 없습니다.</td>
    </tr>
    </tbody>
  </table>

  <!-- 페이지네이션 -->
  <div class="pagination">
    <button id="prev-page" disabled>◀</button>
    <span id="page-numbers"></span>
    <button id="next-page">▶</button>
  </div>
</section>

</body>
</html>
