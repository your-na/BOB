<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>검색 결과</title>
  <link rel="stylesheet" href="/css/search_result.css">
  <link rel="stylesheet" th:href="@{/css/header.css}">
</head>
<body>
<!-- header -->
<div th:insert="~{header :: header}"></div>

<div class="search-container">
  <h2>
    <span class="keyword" th:text="'&quot;' + ${kw} + '&quot;'">"디자인"</span>
    으로 검색한 결과입니다
    <span class="count" th:text="'(총 ' + ${totalResults} + '개)'">(총 10개)</span>
  </h2>


  <div class="search-tabs">
    <button class="tab active" onclick="showTab('contests')">공모전</button>
    <button class="tab" onclick="showTab('projects')">프로젝트</button>
    <button class="tab" onclick="showTab('posts')">게시글</button>
    <button class="tab" onclick="showTab('profiles')">프로필</button>
  </div>

  <!-- 공모전 -->
  <div id="contests" class="tab-content active">
    <div th:each="contest : ${contests}"
         class="result-card contest-card"
         th:attr="data-id=${contest.id}">
      <h4 th:text="${contest.title}">공모전 제목</h4>
      <p th:text="'접수: ' + ${contest.startDate} + ' ~ ' + ${contest.endDate}">기간</p>
    </div>
  </div>

  <!-- 프로젝트 -->
  <div id="projects" class="tab-content">
    <div th:each="project : ${projects}"
         class="result-card project-card"
         th:attr="data-id=${project.id}">
      <h4 th:text="${project.title != null ? project.title : '제목 없음'}">프로젝트 제목</h4>
      <p th:text="${project.creatorNick != null ? project.creatorNick : '작성자 없음'} + ' · ' + ${project.startDate} + ' ~ ' + ${project.endDate}">
        작성자 및 기간
      </p>
    </div>
  </div>

  <div id="posts" class="tab-content">
    <div th:each="post : ${posts}" class="result-card">
      <h4 th:text="${post.title}">게시글 제목</h4>
      <p th:text="${post.createdDate} + ' · 조회수 ' + ${post.views}">정보</p>
    </div>
  </div>

  <div id="profiles" class="tab-content">
    <div th:each="profile : ${profiles}" class="profile-card" th:attr="data-user-id=${profile.id}">
      <img th:src="@{/images/profile.png}" alt="프로필" class="profile-img">
      <div>
        <strong th:text="${profile.userNick}">닉네임</strong>
        <p th:text="${profile.region != null ? profile.region : '지역 정보 없음'}">지역</p>
      </div>
    </div>
  </div>
</div>

<script src="/js/search_result.js"></script>
</body>
</html>
