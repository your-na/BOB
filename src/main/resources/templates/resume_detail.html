<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="_csrf" th:content="${_csrf.token}" />
  <meta name="_csrf_header" th:content="${_csrf.headerName}" />
  <input type="hidden" id="jobPostId" th:value="${jobPostId}" />
  <input type="hidden" id="resumeId" th:value="${resume.id}" />
  <title>이력서 상세보기</title>
  <link rel="stylesheet" href="/css/resume_detail.css">
  <link rel="stylesheet" th:href="@{/css/header.css}">
</head>
<body>
<!-- header -->
<div sec:authorize="hasAuthority('COMPANY')">
  <div th:insert="~{header2 :: header}"></div>
</div>

<div sec:authorize="!hasAuthority('COMPANY')">
  <div th:insert="~{header :: header}"></div>
</div>

<form>
  <div class="resume-detail-container">

    <!-- 수정/삭제 버튼 -->
    <div class="resume-buttons">
      <div sec:authorize="!hasAuthority('COMPANY')">
        <button class="delete-btn">지원 취소하기</button>
      </div>

      <div sec:authorize="hasAuthority('COMPANY')">
        <button type="button" class="nonpass-btn">❎ 불합격 처리</button>
        <button type="button" class="pass-btn">✅ 합격 처리</button>
      </div>
    </div>

    <!-- ✅ 합격 처리 모달 -->
    <div id="passModal" class="modal">
      <div class="modal-content">
        <span class="close" onclick="closePassModal()">&times;</span>
        <h2>정말 합격 처리하시겠습니까?</h2>
        <p>지원자에게 전달할 메시지를 입력해 주세요.</p>
        <textarea id="passMessage" placeholder="예: 귀하의 지원을 축하드립니다!"></textarea>
        <div class="modal-actions">
          <button id="submitPassBtn" type="button">확인</button>
          <button onclick="closePassModal()">취소</button>
        </div>
      </div>
    </div>

    <!-- 프로필 정보 -->
    <div class="profile-row">
      <div class="photo-wrapper">
        <img th:src="@{'/profileImages/' + ${resume.profileImageUrl}}" alt="프로필 사진">
      </div>
      <div class="profile-info">
        <div class="name-skill">
          <strong th:text="${resume.userName}">사용자 이름</strong>
          <span class="skill" th:text="${resume.mainLanguage}">기술</span>
        </div>
        <div class="info-table">
          <div><strong>성별</strong> <span th:text="${resume.sex}">성별</span></div>
          <div><strong>생년월일</strong>
            <span th:text="${resume.birthday}">YYYY-MM-DD</span>
            (<span th:text="${resume.age}">나이</span>)
          </div>
          <div><strong>전화번호</strong> <span th:text="${resume.userPhone}">전화번호</span></div>
          <div><strong>이메일</strong> <span th:text="${resume.userEmail}">이메일</span></div>
          <div><strong>주소</strong> <span th:text="${resume.region}">주소</span></div>
        </div>
      </div>
    </div>

    <!-- ✅ 희망직무 (학력사항 위로 고정) -->
    <div th:each="section : ${resume.sections}" th:if="${section.title == '희망직무'}" class="info-section">
      <h3 th:text="${section.title}">희망직무</h3>
      <div th:if="${section.selectedTags != null}">
        <span th:each="tag : ${section.selectedTags}" class="tag" th:text="${tag}">태그</span>
      </div>
    </div>

    <!-- ✅ 나머지 섹션 (희망직무 제외) -->
    <div th:each="section : ${resume.sections}" th:if="${section.title != '희망직무'}" class="info-section">

      <!-- 섹션 제목 -->
      <h3 th:text="${section.title}">섹션 제목</h3>

      <!-- 학력사항 -->
      <div th:if="${section.title == '학력사항'}">
        <table class="detail-table">
          <thead>
          <tr>
            <th>학교</th>
            <th>학과</th>
            <th>상태</th>
            <th>기간</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="edu : ${section.educations}">
            <td th:text="${edu.schoolName}">학교명</td>
            <td th:text="${edu.majorName}">학과</td>
            <td th:text="${edu.status}">상태</td>
            <td th:text="|${edu.startYear}.${edu.startMonth} ~ ${edu.endYear}.${edu.endMonth}|">기간</td>
          </tr>
          </tbody>
        </table>
      </div>

      <!-- 경력사항 -->
      <div th:if="${section.title == '경력사항'}">
        <table class="detail-table">
          <thead>
          <tr>
            <th>근무지</th>
            <th>직무</th>
            <th>상태</th>
            <th>기간</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="career : ${section.careers}">
            <td th:text="${career.workplace}">근무지</td>
            <td th:text="${career.jobTitle}">직무</td>
            <td th:text="${career.status}">상태</td>
            <td th:text="|${#temporals.format(career.startDate, 'yyyy-MM-dd')} ~ ${#temporals.format(career.endDate, 'yyyy-MM-dd')}|">기간</td>
          </tr>
          </tbody>
        </table>
      </div>

      <!-- 포트폴리오 -->
      <div th:if="${section.title == '포트폴리오'}">
        <table class="detail-table">
          <thead>
          <tr>
            <th>제목</th>
            <th>파일명</th>
            <th>기간</th>
            <th>구분</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="portfolio : ${section.portfolios}">
            <td th:text="${portfolio.title}">제목</td>
            <td>
              <a th:if="${portfolio.filePath != null}"
                 th:href="@{'/uploads/projectFiles/' + ${portfolio.filePath}}"
                 th:text="${portfolio.filePath}"
                 target="_blank">파일보기</a>
            </td>
            <td th:text="|${portfolio.startDate} ~ ${portfolio.endDate}|">기간</td>
            <td th:text="${portfolio.type}">프로젝트</td>
          </tr>
          </tbody>
        </table>
      </div>

      <!-- 자기소개 -->
      <div th:if="${section.title == '자기소개'}">
        <textarea readonly class="readonly-textarea" th:text="${section.content}"></textarea>
      </div>

      <!-- 사진 첨부 -->
      <div th:if="${not #lists.isEmpty(section.fileNames) and section.type?.trim() == '사진 첨부'}">
        <div class="image-preview" th:each="imgName : ${section.fileNames}">
          <img th:src="@{'/uploads/resumeFiles/' + ${imgName}}" alt="첨부 이미지">
        </div>
      </div>

      <!-- 파일 첨부 -->
      <div th:if="${not #lists.isEmpty(section.fileNames) and section.type?.trim() == '파일 첨부'}" class="attachments">
        <div class="file-download" th:each="fileName : ${section.fileNames}">
          <a th:href="@{'/uploads/resumeFiles/' + ${fileName}}" download>
            📄 <span th:text="${fileName}">파일명</span> 다운로드
          </a>
        </div>
      </div>
    </div>


  </div>
</form>

<script src="/js/resume_detail.js"></script>
</body>
</html>
