<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title th:text="${project.title}">프로젝트 상세보기</title>

    <link rel="stylesheet" href="/css/postproject.css">
    <link rel="stylesheet" th:href="@{/css/header.css}">
</head>

<body>
<!-- header -->
<div th:insert="~{header :: header}"></div>

<!-- 제목과 모집현황 -->
<div class="title-row">
    <div class="title" th:text="${project.title}">프로젝트 제목</div>
    <span class="deadline" th:text="'D-' + ${project.dDay}">D-14</span>
    <div class="status">
        모집현황
<!--        <span th:text="${project.currentParticipants} + '/' + ${project.recruitmentCount}"></span>-->
        <div class="team">
            <!-- 총 정원(recruitmentCount) 만큼 반복 -->
            <span th:each="i : ${#numbers.sequence(1, project.recruitmentCount)}">
            <img th:src="${i <= project.currentParticipants} ? '/images/team.png' : '/images/user.png'">
        </span>
        </div>
    </div>

    <div class="post-detail">
        <img class="postdetail" src="/images/postdetail.png" alt="점 세 개" onclick="toggleDropdown()" th:if="${isOwner}">
        <div class="dropdownmenu" id="dropdownMenu" style="display: none;" th:if="${isOwner}">
            <a class="action-button" th:href="@{'/postproject/' + ${project.id} + '/edit'}">수정하기</a>
            <a class="action-button" href="javascript:void(0);" onclick="deleteProject()">삭제하기</a>
        </div>
    </div>
</div>
<hr>

<!-- 작성자 및 작성일 -->
<div class="meta">
    <a class="meta1"
       th:href="@{'/profileview?userNick=' + ${project.createdBy}}"
       th:text="${project.createdBy}">
        작성자
    </a>
    <span class="meta2" th:text="'작성일 : ' + ${today}">작성일</span>
</div>

<div class="form-group">
    <label for="project-dates">진행 일정</label>
    <div class="date-inputs">
        <span id="start-date" th:text="${project.startDate}"></span>
        <span>~</span>
        <span id="end-date" th:text="${project.endDate}"></span>
    </div>
</div>

<div class="form-group">
    <label for="party-dates">모집 일정</label>
    <div class="date-inputs">
        <span id="startdate" th:text="${project.recruitmentStartDate}"></span>
        <span>~</span>
        <span id="enddate" th:text="${project.recruitmentEndDate}"></span>
    </div>
</div>

<!-- 프로젝트 목표 -->
<div class="good">
    <p>프로젝트 목표</p>
    <div class="goal">
        <span th:text="${goal}">여기에 프로젝트 목표가 들어갑니다.</span>
    </div>
</div>

<!-- 프로젝트 설명 -->
<div class="good">
    <p>프로젝트 내용</p>
    <div class="content" th:text="${project.description}">프로젝트 설명 내용</div>
</div>

<!-- 프로젝트 신청 페이지로 이동하는 버튼 -->
<form action="/projectapplication" method="get">
    <input type="hidden" name="projectId" th:value="${project.id}">
    <button type="submit"
            class="apply-btn"
            th:disabled="${isOwner}"
            th:style="${isOwner} ? 'background: grey; cursor: not-allowed;' : ''">
        팀 신청하기
    </button>
    <p th:if="${isOwner}" style="color: red; font-size: 13px; margin-top: 5px;">
        본인이 작성한 프로젝트에는 신청할 수 없습니다.
    </p>
</form>
<hr>

<!-- 좋아요 & 스크랩 -->
<div class="interaction">
    <div id="heart" onclick="toggleHeart()">
        <img id="heartImage" th:if="${isLiked}" src="/images/fillheart.png">
        <img id="heartImage" th:unless="${isLiked}" src="/images/heart.png">
        <span id="likesCount" th:text="${likesCount}">0</span>
    </div>
    <div id="scrap"><img src="/images/scrap.png"> <span>0</span></div>
</div>


<!-- 댓글 입력 -->
<div class="comment-section">
    <form id="commentForm">
        <input type="text" id="commentInput" class="comment-box" placeholder="댓글을 작성해주세요.">
        <button type="submit" class="postbutton">등록</button>
    </form>

    <!-- 댓글 목록 -->
    <div id="commentList" class="comment-list"></div>
</div>

<!-- 로그인 사용자 닉네임 숨김 -->
<span id="currentUserNick" th:text="${#authentication.principal.userNick}" hidden></span>


<!-- JavaScript -->
<script defer>
    document.addEventListener("DOMContentLoaded", function () {
        console.log("🚀 JavaScript 로드 완료!");

        const projectId = window.location.pathname.split("/")[2];
        const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

        // ====== ✅ 댓글 기능 ======
        const commentForm = document.getElementById("commentForm");
        const commentInput = document.getElementById("commentInput");
        const commentList = document.getElementById("commentList");

        // 댓글 목록 불러오기
        function loadComments() {
            fetch(`/project/${projectId}/comments`)
                .then(res => res.json())
                .then(comments => {
                    commentList.innerHTML = "";
                    comments.forEach(c => {
                        const isPostOwner = (c.writer === document.querySelector(".meta1").textContent.trim());

                        const div = document.createElement("div");
                        div.classList.add("comment-item");

                        // ✅ 프로필 이미지 (없을 경우 기본 이미지 사용)
                        const profileImg = c.profileImageUrl ? c.profileImageUrl : '/images/profile.png';

                        div.innerHTML = `
                    <img class="comment-avatar" src="${profileImg}" alt="프로필">
                    <div class="comment-body">
                        <div class="comment-header">
                            <span class="comment-writer">${c.writer}</span>
                            ${isPostOwner ? '<span class="comment-label">작성자</span>' : ''}
                            <span class="comment-date">${new Date(c.createdAt).toLocaleString()}</span>
                        </div>
                        <p class="comment-text">${c.content}</p>
                    </div>
                `;
                        commentList.appendChild(div);
                    });
                })
                .catch(err => console.error("❌ 댓글 불러오기 실패:", err));
        }


// 댓글 등록 이벤트
        commentForm.addEventListener("submit", e => {
            e.preventDefault();
            const text = commentInput.value.trim();
            if (!text) return alert("댓글을 입력해주세요!");

            fetch(`/project/${projectId}/comment`, {
                method: "POST",
                headers: {
                    [csrfHeader]: csrfToken,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ content: text })
            })
                .then(res => res.json())
                .then(c => {
                    const projectWriter = document.querySelector(".meta1").textContent.trim();
                    const isPostOwner = (c.writer === projectWriter);
                    const profileImg = c.profileImageUrl ? c.profileImageUrl : '/images/profile.png';

                    const div = document.createElement("div");
                    div.classList.add("comment-item");
                    div.innerHTML = `
                <img class="comment-avatar" src="${profileImg}" alt="프로필">
                <div class="comment-body">
                    <div class="comment-header">
                        <span class="comment-writer">${c.writer}</span>
                        ${isPostOwner ? '<span class="comment-label">작성자</span>' : ''}
                        <span class="comment-date">${new Date(c.createdAt).toLocaleString()}</span>
                    </div>
                    <p class="comment-text">${c.content}</p>
                </div>
            `;
                    commentList.appendChild(div);
                    commentInput.value = "";
                })
                .catch(err => console.error("❌ 댓글 작성 실패:", err));
        });



        // 페이지 로드 시 기존 댓글 불러오기
        loadComments();


        // ====== ✅ 점 세 개(...) 드롭다운 ======
        window.toggleDropdown = function () {
            const dropdown = document.getElementById("dropdownMenu");
            dropdown.style.display = (dropdown.style.display === "none" || dropdown.style.display === "")
                ? "block" : "none";
        };

        document.addEventListener("click", function (event) {
            const dropdown = document.getElementById("dropdownMenu");
            const button = document.querySelector(".postdetail");
            if (dropdown && button && !dropdown.contains(event.target) && !button.contains(event.target)) {
                dropdown.style.display = "none";
            }
        });


        // ====== ✅ 프로젝트 삭제 ======
        window.deleteProject = function () {
            if (!confirm("⚠️ 정말 삭제하시겠습니까? 삭제 후 복구할 수 없습니다!")) return;

            fetch(`/postproject/${projectId}`, {
                method: "DELETE",
                headers: {
                    [csrfHeader]: csrfToken,
                    "Content-Type": "application/json"
                }
            })
                .then(res => {
                    if (res.ok) {
                        alert("✅ 프로젝트가 삭제되었습니다.");
                        window.location.href = "/project";
                    } else {
                        alert("❌ 프로젝트 삭제 실패");
                    }
                })
                .catch(err => {
                    console.error("❌ 삭제 중 오류:", err);
                    alert("❌ 프로젝트 삭제 중 오류 발생");
                });
        };


        // ====== ✅ 좋아요 토글 ======
        window.toggleHeart = function () {
            fetch(`/project/${projectId}/like`, {
                method: "POST",
                headers: {
                    [csrfHeader]: csrfToken,
                    "Content-Type": "application/json"
                }
            })
                .then(res => res.json())
                .then(data => {
                    const heartImg = document.getElementById("heartImage");
                    heartImg.src = data.liked ? "/images/fillheart.png" : "/images/heart.png";
                    document.getElementById("likesCount").innerText = data.likes;
                })
                .catch(err => {
                    console.error("❌ 좋아요 처리 중 오류:", err);
                    alert("❌ 좋아요 처리 실패");
                });
        };
    });
</script>


</body>
</html>
