<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게시글 목록</title>
    <link rel="stylesheet" href="/css/boardlist.css">
    <link rel="stylesheet" th:href="@{/css/header.css}">
</head>
<body>
<!-- header -->
<div th:insert="~{header :: header}"></div>

<div class="page-wrapper">
    <div class="container">

        <div class="header-line">
            <h2 class="page-title">게시글 목록</h2>
        </div>

        <!-- 카테고리 + 검색 + 작성하기 -->
        <div class="category-and-search">
            <div class="category-filter">
                <button class="active">전체</button>
                <button>공모전</button>
                <button>프로젝트</button>
                <button>자유/수다</button>
                <button>취업꿀팁</button>
            </div>

            <div class="right-controls">
                <div class="search-box">
                    <input type="text" placeholder="검색어를 입력해주세요">
                    <button class="search-btn">
                        <img src="/images/search.png" alt="검색" />
                    </button>
                </div>
                <button class="write-btn" onclick="location.href='/boardwrite'">작성하기</button>
            </div>
        </div>

        <!-- 게시글 목록 테이블 -->
        <table class="board-table">
            <thead>
            <tr>
                <th>게시판</th>
                <th>제목</th>
                <th>작성자</th>
                <th>작성일</th>
            </tr>
            </thead>

            <tbody id="postList"></tbody>
        </table>
    </div>
</div>

<script>
    // 더미 데이터 (예시용)
    const posts = [
        { board: "자유/수다", title: "슈붕 vs 팥붕", writer: "사용자1", date: "25/11/15 17:18" },
        { board: "공모전", title: "공모전 수상 받으면 관련 취업할 때 좋은가요?", writer: "사용자2", date: "25/11/16 09:10" },
        { board: "프로젝트", title: "프로젝트 주제 추천 받습니다", writer: "사용자3", date: "25/11/17 12:00" },
        { board: "취업꿀팁", title: "면접 팁 공유한다ㅋㅋ", writer: "사용자4", date: "25/11/18 14:20" },
        { board: "자유/수다", title: "날씨 갑자기 왤케 추워짐?", writer: "사용자5", date: "25/11/19 11:11" },
        { board: "취업꿀팁", title: "1분 자기소개서 다들 어떤 식으로 쓰셨나요?", writer: "사용자6", date: "25/11/18 14:20" },
        { board: "자유/수다", title: "브롤스타즈 할 사람 구함", writer: "사용자9", date: "25/11/15 00:20" },
    ];

    const tbody = document.getElementById("postList");

    function renderPosts(list) {
        tbody.innerHTML = ""; // 테이블 초기화

        list.forEach(post => {
            const tr = document.createElement("tr");

            tr.innerHTML = `
            <td>${post.board}</td>
            <td>${post.title}</td>
            <td>${post.writer}</td>
            <td>${post.date}</td>
        `;

            // 🔥 게시글 클릭 시 상세보기 페이지로 이동
            tr.style.cursor = "pointer";  // 마우스 커서 변경
            tr.addEventListener("click", () => {
                location.href = "/boarddetail";
            });

            tbody.appendChild(tr);
        });
    }

    // 페이지 들어오면 전체 게시글 출력
    renderPosts(posts);

    // 카테고리 버튼 클릭 시 active 변경 + 필터 실행
    const categoryButtons = document.querySelectorAll(".category-filter button");

    categoryButtons.forEach(button => {
        button.addEventListener("click", () => {

            // 1) active 클래스 변경
            categoryButtons.forEach(btn => btn.classList.remove("active"));
            button.classList.add("active");

            const category = button.textContent.trim(); // 전체 / 공모전 / 자유/수다 등

            // 2) 필터링 로직
            if (category === "전체") {
                renderPosts(posts);
            } else {
                const filtered = posts.filter(post => post.board === category);
                renderPosts(filtered);
            }
        });
    });
</script>
</body>
