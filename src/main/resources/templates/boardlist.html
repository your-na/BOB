<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게시글 목록</title>
    <link rel="stylesheet" href="/css/boardlist.css">
    <link rel="stylesheet" th:href="@{/css/header.css}">
</head>
<body>
<!-- header -->
<div th:insert="~{header :: header}"></div>

<div class="page-wrapper">
    <div class="container">

        <div class="header-line">
            <h2 class="page-title">게시글 목록</h2>
        </div>

        <!-- 카테고리 + 검색 + 작성하기 -->
        <div class="category-and-search">
            <div class="category-filter">
                <button class="active">전체</button>
                <button>공모전</button>
                <button>프로젝트</button>
                <button>자유/수다</button>
                <button>취업꿀팁</button>
            </div>

            <div class="right-controls">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="검색어를 입력해주세요">
                    <button class="search-btn">
                        <img src="/images/search.png" alt="검색" />
                    </button>
                </div>
                <button class="write-btn" onclick="location.href='/boardwrite'">작성하기</button>
            </div>
        </div>

        <!-- 게시글 목록 테이블 -->
        <table class="board-table">
            <thead>
            <tr>
                <th>게시판</th>
                <th>제목</th>
                <th>작성자</th>
                <th>작성일</th>
            </tr>
            </thead>
            <tbody id="postList"></tbody>
        </table>
    </div>
</div>

<script>
    const tbody = document.getElementById("postList");

    // 게시글 렌더링 함수
    function renderPosts(list) {
        tbody.innerHTML = "";

        list.forEach(post => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${post.category.replace("_", "/")}</td>
                <td>${post.title}</td>
                <td>${post.writer}</td>
                <td>${post.createdAt}</td>
            `;
            tr.style.cursor = "pointer";
            tr.addEventListener("click", () => {
                location.href = "/boarddetail?id=" + post.id;
            });
            tbody.appendChild(tr);
        });
    }

    let postsData = [];

    // 초기 게시글 불러오기
    fetch("/api/posts")
        .then(res => {
            if (!res.ok) throw new Error("게시글 불러오기 실패");
            return res.json();
        })
        .then(data => {
            postsData = data;
            renderPosts(postsData);
        })
        .catch(err => {
            alert("에러 발생: " + err.message);
        });

    // 카테고리 필터
    const categoryButtons = document.querySelectorAll(".category-filter button");
    categoryButtons.forEach(button => {
        button.addEventListener("click", () => {
            categoryButtons.forEach(btn => btn.classList.remove("active"));
            button.classList.add("active");

            const category = button.textContent.trim();
            if (category === "전체") {
                renderPosts(postsData);
            } else {
                const filtered = postsData.filter(post => post.category.replace("_", "/") === category);
                renderPosts(filtered);
            }
        });
    });

    // 검색 필터
    const searchInput = document.getElementById("searchInput");
    const searchBtn = document.querySelector(".search-btn");

    searchBtn.addEventListener("click", () => {
        const keyword = searchInput.value.trim();
        if (keyword === "") {
            renderPosts(postsData);
            return;
        }

        const filtered = postsData.filter(post =>
            post.title.includes(keyword) ||
            post.writer.includes(keyword) ||
            post.category.includes(keyword)
        );
        renderPosts(filtered);
    });
</script>
</body>
</html>
