<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="/css/job.css">
    <link rel="stylesheet" th:href="@{/css/header.css}">
</head>
<body>
<!-- header -->
<div th:insert="~{header :: header}"></div>

<div class="container">
    <!-- 오른쪽 채용 정보 섹션 -->
    <div class="jobs-section">
        <h2>채용정보 <span class="job-count">총 115건</span></h2>

        <div class="job-head">
            <form>
                <!-- 검색 아이콘 -->

                <div class="search-container">
                    <div class="searchicon" id="searchicon">
                        <img src="/images/search-icon.png" alt="">
                    </div>
                    <!-- 검색창 (처음엔 숨김) -->
                    <div class="search-box" id="search-box">
                        <input type="text" placeholder="프로젝트 검색..." id="search-input">
                        <button type="button" id="search-close">&times;</button>
                    </div>
                </div>
            </form>
            <div class="filters">
                <select>
                    <option>기업 형태 전체</option>
                </select>
                <select>
                    <option>관련도순</option>
                </select>
            </div>
        </div>
        <!-- 채용 공고 리스트 -->
        <div class="job-list">
            <!-- 여기를 JavaScript로 동적으로 채움 -->
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        var searchIcon = document.getElementById("searchicon");
        var searchBox = document.getElementById("search-box");
        var searchClose = document.getElementById("search-close");

        // 검색 아이콘 클릭 시 검색창 표시/숨김
        searchIcon.addEventListener("click", function () {
            if (searchBox.style.display === "none" || searchBox.style.display === "") {
                searchBox.style.display = "flex"; // 검색창 보이기
            } else {
                searchBox.style.display = "none"; // 검색창 숨기기
            }
        });
        fetch('/api/cojobs')
            .then(res => res.json())
            .then(data => {
                console.log("서버에서 받은 공고 데이터:", data); // ✅ testing...
                const jobListContainer = document.querySelector(".job-list");
                const jobCount = document.querySelector(".job-count");
                jobListContainer.innerHTML = '';

                jobCount.textContent = `총 ${data.length}건`;

                data.forEach(job => {
                    const jobCard = document.createElement("div");
                    jobCard.className = "job-card";

                    // ✅ 변수 선언
                    let submitMark = '';

                    // ✅ 제출 방식 마크 설정
                    if (job.applyType === 'company') {
                        submitMark = `<span class="job-mark company">기업 양식 제출</span>`;
                    } else if (job.applyType === 'member') {
                        submitMark = `<span class="job-mark resume">회원 이력서 제출</span>`;
                    }

                    // 클릭 시 상세보기 이동
                    jobCard.addEventListener("click", function () {
                        window.location.href = `/jobindex?id=${job.id}`;
                    });

                    jobCard.innerHTML = `
                ${submitMark}
                <h3>[${job.title}]</h3>
                <p><span class="job-phone"><img src="/images/job_phone.png"></span> ${job.phone} | 경력 ${job.career} 이상</p>
                <p><span class="job-place"><img src="/images/job_place.png"></span> ${job.companyNick}</p>
            `;

                    jobListContainer.appendChild(jobCard);
                });
            })
            .catch(error => {
                console.error("공고 불러오기 실패:", error);
            });


        // 닫기 버튼 클릭 시 검색창 숨기기
        searchClose.addEventListener("click", function () {
            searchBox.style.display = "none";
        });
    });

</script>
</body>
</html>
