<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>나만의 이력서 상세보기</title>
  <link rel="stylesheet" th:href="@{/css/resume_detail.css}">
  <link rel="stylesheet" th:href="@{/css/header.css}">
</head>
<body>

<!-- ✅ 기본 사용자용 헤더 -->
<div th:insert="~{header :: header}"></div>

<div class="resume-detail-container">

  <!-- 이력서 제목 -->
  <h2 th:text="${resume.title}">이력서 제목</h2>

  <!-- ✅ 섹션들 반복 -->
  <div th:each="section : ${resume.sections}" class="info-section">
    <!-- 섹션 제목 -->
    <h3 th:text="${section.title}">섹션 제목</h3>

    <!-- 설명(comment) -->
    <p th:if="${section.comment}" th:text="${section.comment}">섹션 설명</p>

    <!-- 본문 내용 -->
    <div th:if="${section.content != null and section.content != ''}">
      <p th:text="${section.content}">본문 내용</p>
    </div>

    <!-- ✅ 조건 리스트 -->
    <div th:if="${section.conditions != null and !section.conditions.isEmpty()}" class="tag-box">
      <strong>조건:</strong>
      <span th:each="cond : ${section.conditions}" class="tag" th:text="${cond}">조건</span>
    </div>

    <!-- ✅ 태그 리스트 -->
    <div th:if="${section.tags != null and !section.tags.isEmpty()}" class="tag-box">
      <strong>태그:</strong>
      <span th:each="tag : ${section.tags}" class="tag" th:text="${tag}">태그</span>
    </div>

    <!-- ✅ 사진 첨부 미리보기 -->
    <div th:if="${not #lists.isEmpty(section.fileNames) and section.type?.trim() == '사진 첨부'}">
      <div class="image-preview" th:each="imgName : ${section.fileNames}">
        <img th:src="@{'/uploads/resumeFiles/' + ${imgName}}" alt="첨부 이미지" style="width: 150px;">
      </div>
    </div>

    <!-- ✅ 파일 다운로드 링크 -->
    <div th:if="${not #lists.isEmpty(section.fileNames) and section.type?.trim() == '파일 첨부'}" class="attachments">
      <div class="file-download" th:each="fileName : ${section.fileNames}">
        <a th:href="@{'/uploads/resumeFiles/' + ${fileName}}" download>
          📄 <span th:text="${fileName}">파일명</span> 다운로드
        </a>
      </div>
    </div>

  </div> <!-- end of section 반복 -->

</div> <!-- end of resume-detail-container -->

<!-- ✅ 트리 뷰 JS 연결 -->
<script src="/js/myresume_detail.js"></script>

</body>
</html>
