<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>나만의 이력서 상세보기</title>
  <link rel="stylesheet" th:href="@{/css/resume_detail.css}">
  <link rel="stylesheet" th:href="@{/css/header.css}">
</head>
<body>

<!-- ✅ 헤더 삽입 -->
<div th:if="${!isPreview}">
  <div sec:authorize="hasAuthority('COMPANY')">
    <div th:insert="~{header2 :: header}"></div>
  </div>
  <div sec:authorize="!hasAuthority('COMPANY')">
    <div th:insert="~{header :: header}"></div>
  </div>
</div>


<div class="resume-detail-container">

  <!-- ✅ 오른쪽 상단 버튼 -->
  <div class="resume-buttons">
    <button id="downloadBtn">다운받기</button>
    <div sec:authorize="hasAuthority('COMPANY')">
      <button type="button" class="nonpass-btn">❎ 불합격 처리</button>
      <button type="button" class="pass-btn">✅ 합격 처리</button>
    </div>
  </div>

  <!-- ✅ 합격 처리 모달 -->
  <div id="passModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closePassModal()">&times;</span>
      <h2>정말 합격 처리하시겠습니까?</h2>
      <p>지원자에게 전달할 메시지를 입력해 주세요.</p>
      <textarea id="passMessage" placeholder="예: 귀하의 지원을 축하드립니다!"></textarea>
      <div class="modal-actions">
        <button id="submitPassBtn" type="button">확인</button>
        <button type="button" onclick="closePassModal()">취소</button>
      </div>
    </div>
  </div>

  <!-- ✅ 사용자 프로필 정보 -->
  <div class="profile-row">
    <div class="photo-wrapper">
      <img th:src="${profileImageUrl != null ? profileImageUrl : '/images/profile.png'}" alt="profile" id="profileimg">
    </div>
    <div class="profile-info">
      <div class="name-skill">
        <strong th:text="${resume.userName}"></strong>
        <span class="skill" th:text="${resume.mainLanguage}"></span>
      </div>
      <div class="info-table">
        <div><strong>성별</strong> <span th:text="${resume.sex}"></span></div>
        <div><strong>생년월일</strong>
          <span th:text="${resume.birthday}"></span>
          (<span th:text="${resume.age}"></span>)
        </div>
        <div><strong>전화번호</strong> <span th:text="${resume.userPhone}"></span></div>
        <div><strong>이메일</strong> <span th:text="${resume.userEmail}"></span></div>
        <div><strong>주소</strong> <span th:text="${resume.region}"></span></div>
        <div><strong>한문 이름</strong> <span th:text="${resume.nameHanja}"></span></div>
        <div><strong>영문 이름</strong> <span th:text="${resume.nameEng}"></span></div>
      </div>
    </div>
  </div>

  <!-- ✅ 섹션 반복 (교체) -->
  <div th:each="section : ${resume.sections}" class="info-section"
       th:with="title=${#strings.trim(section.title)}">

    <!-- 섹션 제목 -->
    <h3 th:text="${title}"></h3>

    <!-- ✅ 학력사항 표 -->
    <div th:if="${title == '학력사항'}">
      <table class="resume-table">
        <thead>
        <tr>
          <th>학교</th>
          <th>학과</th>
          <th>상태</th>
          <th>기간</th>
        </tr>
        </thead>
        <tbody>
        <!-- dragItems가 있을 때 -->
        <tr th:each="item : ${section.dragItems}" th:if="${not #lists.isEmpty(section.dragItems)}">
          <td th:text="${item.schoolName != null ? item.schoolName : item.workplace}"></td>
          <td th:text="${item.major != null ? item.major : item.jobTitle}"></td>
          <td th:text="${item.status}"></td>
          <td>
            <span th:text="${item.startDate}"></span> ~
            <span th:text="${item.endDate}"></span>
          </td>
        </tr>

        <!-- dragItems가 비어 있고, content에 여러 학력이 들어 있는 경우 -->
        <tr th:each="line : ${#strings.arraySplit(section.content, '\\|')}"
            th:if="${#lists.isEmpty(section.dragItems)} and ${section.content != null}">
          <td th:text="${#strings.arraySplit(line, '/')[0]?.replace('학교:', '').trim()}"></td>
          <td th:text="${#strings.arraySplit(line, '/')[1]?.replace('학과:', '').trim()}"></td>
          <td th:text="${#strings.arraySplit(line, '/')[2]?.replace('상태:', '').trim()}"></td>
          <td th:text="${#strings.arraySplit(line, '/')[3]?.replace('기간:', '').trim()}"></td>
        </tr>
        </tbody>
      </table>
    </div>

    <!-- ✅ 경력사항 표 -->
    <div th:if="${title == '경력사항'}">
      <table class="resume-table">
        <thead>
        <tr>
          <th>근무지</th>
          <th>직무</th>
          <th>상태</th>
          <th>기간</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${section.dragItems}" th:if="${not #lists.isEmpty(section.dragItems)}">
          <td th:text="${item.workplace}"></td>
          <td th:text="${item.jobTitle}"></td>
          <td th:text="${item.status}"></td>
          <td>
            <span th:text="${item.startDate}"></span> ~
            <span th:text="${item.endDate}"></span>
            (<span th:text="${item.periodMonths}"></span>개월)
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(section.dragItems)}">
          <td colspan="4" th:text="${section.content != null ? section.content : '등록된 경력사항이 없습니다.'}"></td>
        </tr>
        </tbody>
      </table>
    </div>

    <!-- ✅ 포트폴리오 표 -->
    <div th:if="${title == '포트폴리오'}">
      <table class="resume-table">
        <thead>
        <tr>
          <th>제목</th>
          <th>파일명</th>
          <th>기간</th>
          <th>구분</th>
        </tr>
        </thead>
        <tbody>
        <!-- fileNames가 있을 때 -->
        <tr th:each="file : ${section.fileNames}" th:if="${section.fileNames != null and !section.fileNames.isEmpty()}">
          <td>
            <a th:href="@{'/uploads/resumeFiles/' + ${file}}" download>
              <span th:text="${file}"></span>
            </a>
          </td>
          <td>이력서</td>
        </tr>
        <!-- fileNames가 비면 dragItems의 filePath로 대체 -->
        <tr th:each="item : ${section.dragItems}"
            th:if="${(section.fileNames == null or section.fileNames.isEmpty()) and not #lists.isEmpty(section.dragItems) and item.filePath != null}">
          <!-- 제목 -->
          <td th:text="${item.displayText != null ? item.displayText : '-'}"></td>


          <td>
            <a th:href="@{'/uploads/resumeFiles/' + ${item.filePath}}" download>
              <span th:text="${item.filePath}"></span>
            </a>
          </td>
          <td>
            <span th:text="${item.startDate}"></span> ~
            <span th:text="${item.endDate}"></span>
          </td>
          <td>
            <span th:text="${section.type == 'CONTEST' ? '공모전' : '프로젝트'}"></span>
            <span th:if="${item.displayText != null and item.displayText != ''}">
  </span>
          </td>
        </tr>
        <!-- 둘 다 없으면 content 또는 안내 -->
        <tr th:if="${(section.fileNames == null or section.fileNames.isEmpty()) and #lists.isEmpty(section.dragItems)}">
          <td colspan="2" th:text="${section.content != null ? section.content : '등록된 포트폴리오가 없습니다.'}"></td>
        </tr>
        </tbody>
      </table>
    </div>

    <!-- ✅ 기타 섹션만 textarea 출력 -->
    <div th:if="${section.content != null and section.content != ''
               and title != '학력사항' and title != '경력사항' and title != '포트폴리오'}">
      <textarea readonly th:text="${section.content}"></textarea>
    </div>

    <!-- ✅ 조건/태그/첨부는 기존대로 -->
    <div th:if="${section.conditions != null and !section.conditions.isEmpty()}">
      <strong>조건:</strong>
      <span th:each="cond : ${section.conditions}" class="tag" th:text="${cond}"></span>
    </div>

    <div th:if="${section.tags != null and !section.tags.isEmpty()}">
      <strong>태그:</strong>
      <span th:each="tag : ${section.tags}" class="tag" th:text="${tag}"></span>
    </div>

    <div th:if="${section.fileNames != null and !section.fileNames.isEmpty() and #strings.trim(section.type) == '사진 첨부'}">
      <div class="image-preview" th:each="img : ${section.fileNames}">
        <img th:src="@{'/uploads/resumeFiles/' + ${img}}" alt="첨부 이미지" style="width: 150px;">
      </div>
    </div>

    <div th:if="${section.fileNames != null and !section.fileNames.isEmpty() and #strings.trim(section.type) == '파일 첨부'}" class="attachments">
      <div class="file-download" th:each="file : ${section.fileNames}">
        <a th:href="@{'/uploads/resumeFiles/' + ${file}}" download>
          📄 <span th:text="${file}"></span> 다운로드
        </a>
      </div>
    </div>
  </div>


</div> <!-- end of section -->

</div> <!-- end of container -->

<!-- ✅ JS 외부 파일 연결 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="/js/myresume_detail.js"></script>

</body>
</html>
