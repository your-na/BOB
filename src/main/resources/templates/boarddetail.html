<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>게시글 상세보기</title>
  <link rel="stylesheet" href="/css/boarddetail.css">
  <link rel="stylesheet" th:href="@{/css/header.css}">
</head>

<body>
<div th:insert="~{header :: header}"></div>

<div class="page-wrapper">
  <div class="container">

    <div class="title-row">
      <h2 class="post-title">[게시판 이름]게시글 제목</h2>

      <div class="icon-box">

        <div class="menu-wrapper">
          <img src="/images/notice.png" class="report-icon">
          <img src="/images/menu.png" class="menu-icon">

          <!-- 🔽 메뉴 박스 -->
          <div class="menu-popup">
            삭제하기
          </div>
        </div>

      </div>
    </div>

    <hr class="title-line">

    <!-- 작성자 + 날짜 -->
    <div class="info-row">
      <span class="writer">사용자1</span>
      <span class="post-date">2025.01.03 오후 11:05</span>
    </div>

    <!-- 게시글 본문 -->
    <div class="post-content">
      게시글 내용
    </div>

    <!-- 좋아요/댓글 카운트 -->
    <div class="post-status">
            <span class="like">
                <img src="/images/heart2.png">
                10
            </span>

      <span class="comment">
                <img src="/images/comment.png">
                1
            </span>
    </div>

    <!-- 댓글 영역 -->
    <div class="comment-box">

      <!-- 댓글 1개 예시 -->
      <div class="comment-item">
        <div class="comment-writer">사용자2</div>
        <div class="comment-content">댓글 내용~~~~~~~~</div>
        <div class="comment-date">2025.11.15 10:53</div>

        <img src="/images/heart2.png" class="comment-like">
      </div>

    </div>

    <!-- 댓글 입력 -->
    <div class="comment-write-box">
      <input type="text" class="comment-input" placeholder="댓글을 남겨보세요.">
      <button class="comment-submit">등록</button>
    </div>

  </div>
</div>

<script>
  // 게시글 좋아요 하트 클릭 시 빨간 하트로 변경 (토글)
  const postLikeHeart = document.querySelector('.post-status .like img');

  postLikeHeart.addEventListener('click', () => {
    if (postLikeHeart.src.includes('heart2.png')) {
      postLikeHeart.src = '/images/pinkheart.png';   // 핑크 하트
    } else {
      postLikeHeart.src = '/images/heart2.png';      // 빈 하트
    }
  });

  // 댓글 좋아요 하트 클릭 시 토글
  const commentHearts = document.querySelectorAll('.comment-like');

  commentHearts.forEach(heart => {
    heart.addEventListener('click', () => {
      if (heart.src.includes('heart2.png')) {
        heart.src = '/images/pinkheart.png';
      } else {
        heart.src = '/images/heart2.png';
      }
    });
  });

  const menuIcon = document.querySelector(".menu-icon");
  const menuPopup = document.querySelector(".menu-popup");

  menuIcon.addEventListener("click", (e) => {
    e.stopPropagation();  // 다른 곳 클릭과 구분
    menuPopup.style.display =
            menuPopup.style.display === "block" ? "none" : "block";
  });

  // 다른 곳 클릭 시 메뉴 닫기
  document.addEventListener("click", () => {
    menuPopup.style.display = "none";
  });
</script>

</body>
</html>
