<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>게시글 상세보기</title>
  <link rel="stylesheet" href="/css/boarddetail.css">
  <link rel="stylesheet" th:href="@{/css/header.css}">
</head>

<body>
<div th:insert="~{header :: header}"></div>

<div class="page-wrapper">
  <div class="container">

    <div class="title-row">
      <h2 class="post-title"></h2>

      <div class="icon-box">
        <div class="menu-wrapper">
          <img src="/images/notice.png" class="report-icon">
          <img src="/images/menu.png" class="menu-icon">
          <div class="menu-popup">삭제하기</div>
        </div>
      </div>
    </div>

    <hr class="title-line">

    <div class="info-row">
      <span class="writer"></span>
      <span class="post-date"></span>
    </div>

    <div class="post-content"></div>

    <div class="file-preview" style="margin-top: 20px;"></div>

    <div class="post-status">
      <span class="like">
        <img src="/images/heart2.png">
        10
      </span>
      <span class="comment">
        <img src="/images/comment.png">
        1
      </span>
    </div>

    <div class="comment-box"></div>

    <div class="comment-write-box">
      <input type="text" class="comment-input" placeholder="댓글을 남겨보세요.">
      <button class="comment-submit">등록</button>
    </div>
  </div>
</div>

<!-- ✅ 외부 스크립트 -->
<script src="/js/boarddetail.js"></script>
</body>
</html>
